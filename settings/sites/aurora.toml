[site]
name = "aurora"
message_queue_batch_limit = 1000
cpus_per_node = 102
cores_per_worker = 1
scheduler_options = "#PBS -l filesystems=home:flare"
launcher_options = "--ppn 1 --depth=104 --cpu-bind depth"
cpu_affinity = "aurora"
available_accelerators = 102
pbs_filesystems = "home:flare"
# Cap on outstanding parsl futures. run_stage submits exactly one future per
# advance, so this is roughly the number of workflows in flight and -- for a
# serial dependency chain, where each workflow contributes one runnable task --
# the number of tasks that can actually be dispatched. Size it just above the
# slot count: nodes x max_workers_per_node, here 2048 x 102 = 208896, so 250000
# keeps every slot fed with ~20% spare. Each workflow in flight also costs about
# 16 KiB of driver memory (~3.8 GiB at this setting), which is the reason not to
# set it far higher than the slot count.
max_futures = 250000
worker_init = [
    "export TMPDIR=/tmp/",
]
monitor_cmd = "/home/twester/sbn_parsl_v01/tools/lar_mon.sh --interval 30 -o 'node_mon_$(hostname).jsonl'"

[app.larsoft]
container_path = "/lus/flare/projects/neutrinoGPU/containers/slf7.sif"
larsoft_top = "/lus/flare/projects/neutrinoGPU/scisoft/larsoft"
simulation_inputs = "/lus/flare/projects/neutrinoGPU/simulation_inputs_striped"

[app.larsoft.metadata]
exe = "/lus/flare/projects/neutrinoGPU/larsoft_hpc/tools/sbnpoms_metadata_injector_data.sh"

[site.queues.debug]
nodes_min = 1
nodes_max = 2
walltime_min = "00:05:00"
walltime_max = "01:00:00"

[site.queues.debug-scaling]
nodes_min = 2
nodes_max = 256
walltime_min = "00:05:00"
walltime_max = "01:00:00"

[site.queues.prod]
is_routing = true
routes_to = ["small", "medium", "large"]

[site.queues.small]
nodes_min = 256
nodes_max = 1024
walltime_min = "00:05:00"
walltime_max = "12:00:00"

[site.queues.medium]
nodes_min = 1025
nodes_max = 1919
walltime_min = "00:05:00"
walltime_max = "18:00:00"

[site.queues.large]
nodes_min = 1920
nodes_max = 10624
walltime_min = "00:05:00"
walltime_max = "24:00:00"
