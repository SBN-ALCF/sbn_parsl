[site]
name = "aurora"
message_queue_batch_limit = 1000
cpus_per_node = 102
cores_per_worker = 1
scheduler_options = "#PBS -l filesystems=home:flare"
launcher_options = "--ppn 1 --depth=104 --cpu-bind depth"
cpu_affinity = "aurora"
available_accelerators = 102
pbs_filesystems = "home:flare"
# Cap on outstanding parsl futures. This budgets *submitted* futures, not
# runnable ones, so it has to cover the dependency-blocked ones too. Size it as
#   (nodes x max_workers_per_node) x (futures submitted per workflow advance)
# At 2048 nodes x 102 workers, with an advance that submits 3 futures of which
# only 1 is runnable (gen, then detsim and reco1 waiting on it), that is 626688.
# The previous 300000 capped concurrency at 300000/3 = 100000 tasks, i.e. 48% of
# the 208896 available slots, regardless of how much work was queued.
max_futures = 650000
worker_init = [
    "export TMPDIR=/tmp/",
]
monitor_cmd = "/home/twester/sbn_parsl_v01/tools/lar_mon.sh --interval 30 -o 'node_mon_$(hostname).jsonl'"

[app.larsoft]
container_path = "/lus/flare/projects/neutrinoGPU/containers/slf7.sif"
larsoft_top = "/lus/flare/projects/neutrinoGPU/scisoft/larsoft"
simulation_inputs = "/lus/flare/projects/neutrinoGPU/simulation_inputs_striped"

[app.larsoft.metadata]
exe = "/lus/flare/projects/neutrinoGPU/larsoft_hpc/tools/sbnpoms_metadata_injector_data.sh"

[site.queues.debug]
nodes_min = 1
nodes_max = 2
walltime_min = "00:05:00"
walltime_max = "01:00:00"

[site.queues.debug-scaling]
nodes_min = 2
nodes_max = 256
walltime_min = "00:05:00"
walltime_max = "01:00:00"

[site.queues.prod]
is_routing = true
routes_to = ["small", "medium", "large"]

[site.queues.small]
nodes_min = 256
nodes_max = 1024
walltime_min = "00:05:00"
walltime_max = "12:00:00"

[site.queues.medium]
nodes_min = 1025
nodes_max = 1919
walltime_min = "00:05:00"
walltime_max = "18:00:00"

[site.queues.large]
nodes_min = 1920
nodes_max = 10624
walltime_min = "00:05:00"
walltime_max = "24:00:00"
